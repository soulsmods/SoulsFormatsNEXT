name: Publish NuGet package

on:

  push:
    branches: [nuget-publishing]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Pack
        run: dotnet pack SoulsFormats/SoulsFormats.csproj -c Release -o artifacts -p:Version=${{ format('0.0.1-ci.{0}', github.run_number) }}

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: garyttierney # Any user with access to the soulsmods org and trusted publishing setup

      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
