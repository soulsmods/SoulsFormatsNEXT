name: Integration Testing

on:
  push:
    branches:
      - integration-testing

permissions:
  contents: read

env:
  OODLE_URL: https://github.com/WorkingRobot/OodleUE/releases/download/2026-06-04-1357/gcc-x64-release.zip
  OODLE_SHA256: 458c66945ea6124d4f6fcf64cec5601ab230f61f6677a6ecab6cca621a9d0e11

jobs:
  integration-testing:
    runs-on:
      group: soulsmods-nonfree-runner
      labels: [self-hosted, linux-x64, has-game-data]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Download Oodle
        run: |
          curl -fsSL -o "$RUNNER_TEMP/oodle.zip" "$OODLE_URL"
          echo "$OODLE_SHA256  $RUNNER_TEMP/oodle.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oodle"
          unzip -p "$RUNNER_TEMP/oodle.zip" lib/liboodle-data-shared.so \
            > "$RUNNER_TEMP/oodle/liboo2corelinux64.so.9"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/oodle" >> "$GITHUB_ENV"

      - name: Read game files
        env:
          SOULSFORMATS_GAME_DATA: /mnt/fsvfs
        run: >
          dotnet test SoulsFormats.IntegrationTests -c Release
          --logger "trx;LogFileName=$RUNNER_TEMP/results.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: ${{ runner.temp }}/results.trx
