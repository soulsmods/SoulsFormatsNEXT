name: Integration Testing

on:
  push:
    branches:
      - integration-testing

permissions:
  contents: read
  id-token: write

env:
  OODLE_URL: https://github.com/WorkingRobot/OodleUE/releases/download/2026-06-04-1357/gcc-x64-release.zip
  OODLE_SHA256: 458c66945ea6124d4f6fcf64cec5601ab230f61f6677a6ecab6cca621a9d0e11
  COVERAGE: false

jobs:
  integration-testing:
    runs-on:
      group: soulsmods-nonfree-runner
      labels: [self-hosted, linux-x64, has-game-data]
    timeout-minutes: 360
    env:
      BUCKET: soulsmods-runners-test-results-323036354437
      REPORT: ${{ github.run_id }}/${{ github.run_attempt }}
      HISTORY: history/${{ github.event.merge_group.base_ref || github.ref }}.jsonl.gz
    steps:
      - uses: actions/checkout@v4

      - name: Print OIDC claims
        run: |
          payload=$(curl -fsSH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | grep -o '"value":"[^"]*"' | cut -d'"' -f4 | cut -d. -f2 | tr '_-' '/+')
          while (( ${#payload} % 4 )); do payload+='='; done
          base64 -d <<< "$payload"; echo

      - name: Download Oodle
        run: |
          curl -fsSL -o "$RUNNER_TEMP/oodle.zip" "$OODLE_URL"
          echo "$OODLE_SHA256  $RUNNER_TEMP/oodle.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oodle"
          unzip -p "$RUNNER_TEMP/oodle.zip" lib/liboodle-data-shared.so \
            > "$RUNNER_TEMP/oodle/liboo2corelinux64.so.9"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/oodle" >> "$GITHUB_ENV"

      - name: Configure Allure
        run: |
          echo "{\"allure\": {\"directory\": \"$GITHUB_WORKSPACE/allure-results\"}}" > "$RUNNER_TEMP/allureConfig.json"
          echo "ALLURE_CONFIG=$RUNNER_TEMP/allureConfig.json" >> "$GITHUB_ENV"

      - name: Read game files
        id: tests
        env:
          SOULSFORMATS_GAME_DATA: /mnt/fsvfs
        run: >
          dotnet test SoulsFormats.IntegrationTests -c Release
          --logger "trx;LogFileName=results.trx"
          ${{ env.COVERAGE == 'true' && '--settings SoulsFormats.IntegrationTests/coverage.runsettings --collect "Code Coverage"' || '' }}
          --blame-crash --blame-crash-dump-type mini
          --results-directory "$RUNNER_TEMP/results"

      - name: Find coverage report
        if: always() && env.COVERAGE == 'true'
        run: echo "COVERAGE_FILE=$(find "$RUNNER_TEMP/results" -name '*.cobertura.xml' | head -1)" >> "$GITHUB_ENV"

      - uses: coverallsapp/github-action@v2
        if: always() && env.COVERAGE_FILE != ''
        with:
          file: ${{ env.COVERAGE_FILE }}
          format: cobertura
          base-path: ${{ github.workspace }}

      - uses: aws-actions/configure-aws-credentials@v4
        id: aws
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        with:
          role-to-assume: arn:aws:iam::323036354437:role/soulsmods-runners-publish-test-results
          aws-region: eu-west-1

      - uses: actions/setup-node@v4
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        with:
          node-version: 22

      - name: Download report history
        if: ${{ !cancelled() && steps.aws.outcome == 'success' }}
        run: |
          for history in "$HISTORY" history/refs/heads/master.jsonl.gz; do
            aws s3 cp "s3://$BUCKET/$history" allure-history.jsonl.gz && gunzip allure-history.jsonl.gz && exit 0
          done
          echo "No history yet."

      - name: Generate report
        if: ${{ !cancelled() && steps.aws.outcome == 'success' }}
        env:
          ALLURE_HISTORY_PATH: ${{ github.workspace }}/allure-history.jsonl
          NODE_OPTIONS: --max-old-space-size=24576
        run: >
          npx -y allure@3.22.1 generate allure-results
          --config SoulsFormats.IntegrationTests/allurerc.mjs
          --output allure-report
          --history-limit 5

      - name: Publish report
        if: ${{ !cancelled() && steps.aws.outcome == 'success' }}
        run: |
          s5cmd --numworkers 256 --log error cp 'allure-report/*' "s3://$BUCKET/$REPORT/"
          gzip -c allure-history.jsonl | aws s3 cp - "s3://$BUCKET/$HISTORY"
          echo "[Test report](http://$BUCKET.s3-website-$AWS_REGION.amazonaws.com/$REPORT/)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: ${{ runner.temp }}/results
