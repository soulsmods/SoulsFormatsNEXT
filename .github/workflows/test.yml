name: Integration Testing

on:
  push:
    branches:
      - integration-testing

permissions:
  contents: read

env:
  OODLE_URL: https://github.com/WorkingRobot/OodleUE/releases/download/2026-06-04-1357/gcc-x64-release.zip
  OODLE_SHA256: 458c66945ea6124d4f6fcf64cec5601ab230f61f6677a6ecab6cca621a9d0e11
  COVERAGE: false

jobs:
  integration-testing:
    runs-on:
      group: soulsmods-nonfree-runner
      labels: [self-hosted, linux-x64, has-game-data]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Download Oodle
        run: |
          curl -fsSL -o "$RUNNER_TEMP/oodle.zip" "$OODLE_URL"
          echo "$OODLE_SHA256  $RUNNER_TEMP/oodle.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oodle"
          unzip -p "$RUNNER_TEMP/oodle.zip" lib/liboodle-data-shared.so \
            > "$RUNNER_TEMP/oodle/liboo2corelinux64.so.9"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/oodle" >> "$GITHUB_ENV"

      - name: Read game files
        env:
          SOULSFORMATS_GAME_DATA: /mnt/fsvfs
        run: >
          dotnet test SoulsFormats.IntegrationTests -c Release
          --logger "trx;LogFileName=results.trx"
          ${{ env.COVERAGE == 'true' && '--settings SoulsFormats.IntegrationTests/coverage.runsettings --collect "Code Coverage"' || '' }}
          --blame-crash --blame-crash-dump-type mini
          --results-directory "$RUNNER_TEMP/results"

      - name: Summarize failures
        if: always()
        run: |
          trx="$RUNNER_TEMP/results/results.trx"
          if [ -f "$trx" ]; then
            python3 .github/scripts/test-summary.py "$trx" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No test results" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Find coverage report
        if: always() && env.COVERAGE == 'true'
        run: echo "COVERAGE_FILE=$(find "$RUNNER_TEMP/results" -name '*.cobertura.xml' | head -1)" >> "$GITHUB_ENV"

      - uses: coverallsapp/github-action@v2
        if: always() && env.COVERAGE_FILE != ''
        with:
          file: ${{ env.COVERAGE_FILE }}
          format: cobertura
          base-path: ${{ github.workspace }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: ${{ runner.temp }}/results
